<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shaka with Ease Live</title>
  </head>
  <body>
    <main>
      <h1 id="brand-name">Shaka with Ease Live</h1>
      <!--
        Stacking from the Ease Live 1.22 guide:
        video (z-index 0), overlay (z-index 1), PlayerControls bar (z-index 2, 48px).
        PlayerControls mounts itself into #player-wrapper at startup.
      -->
      <div id="player-wrapper">
        <video id="video" playsinline></video>
        <div id="ease-live-view"></div>
      </div>
      <p id="status">Loading stream…</p>
    </main>
  </body>
</html>
